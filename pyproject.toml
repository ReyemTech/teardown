[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-teardown"
version = "0.6.1"
description = "Passive web-app architecture reconnaissance with subdomain fan-out, emitting an agent-readable JSON contract."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "teardown/data/LICENSE-opentechalyzer"]
authors = [{ name = "Mario Meyer" }]
keywords = ["recon", "security", "osint", "teardown", "subdomains", "passive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = ["httpx>=0.27,<1.0", "tldextract>=5.1,<6.0", "rich>=14,<16", "dnspython>=2.6,<3.0"]

[project.urls]
Homepage = "https://github.com/ReyemTech/teardown"
Documentation = "https://github.com/ReyemTech/teardown/tree/main/docs"
Repository = "https://github.com/ReyemTech/teardown"
Issues = "https://github.com/ReyemTech/teardown/issues"
Changelog = "https://github.com/ReyemTech/teardown/blob/main/CHANGELOG.md"

[project.optional-dependencies]
active-dns = ["dnspython>=2.6,<3.0"]
mcp = ["fastmcp>=2.14,<3; python_version < '3.11'", "fastmcp>=2.14,<5; python_version >= '3.11'"]

[project.scripts]
teardown = "teardown.cli:main"
tech-teardown = "teardown.cli:main"
teardown-mcp = "teardown.mcp_server:main"

[tool.semantic_release]
allow_zero_version = true
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]

[tool.hatch.build.targets.wheel]
packages = ["teardown"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
