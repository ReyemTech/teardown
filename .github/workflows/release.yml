name: Release to PyPI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Use triggering commit
        run: git reset --hard "$GITHUB_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python -m pip install -e '.[active-dns,mcp]' pytest pytest-asyncio
      - run: python -m pytest -q
      - name: Calculate and create release
        id: version
        uses: python-semantic-release/python-semantic-release@d2d6aaf91cf8079cdec167f8673e6d951aefc195 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: 'false'
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
      - name: Build release distributions
        if: steps.version.outputs.released == 'true'
        run: |
          uv build --no-sources
          test -f "dist/tech_teardown-${{ steps.version.outputs.version }}-py3-none-any.whl"
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.released == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always dist/*
