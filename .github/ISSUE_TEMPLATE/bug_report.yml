name: Bug report
description: Report reproducible behavior in Teardown
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include target secrets, source-map contents, or personal data. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: Teardown and Python versions
      placeholder: "tech-teardown 0.6.0; Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a public example or a synthetic fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted output
    validations:
      required: true
